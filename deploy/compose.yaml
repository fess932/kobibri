# kobibri, the way it is meant to be run.
#
# Put your own reverse proxy in front — there is a Caddyfile next to this file
# to start from.

services:
  kobibri:
    build: ..
    # image: ghcr.io/fess932/kobibri:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8078:8078"
    volumes:
      # The database, converted books and scaled covers. Losing this loses the
      # canonical book ids, which is what your readers hold — keep it.
      - kobibri-data:/data
      # Your Calibre libraries, read-only. kobibri never writes to them.
      - /srv/calibre:/library:ro
    environment:
      # The URL a reader will actually use. Set this: it goes into the links
      # kobibri hands the device, and the device remembers them permanently.
      KOBIBRI_BASE_URL: https://books.example.com
      # Only with a proxy in front.
      KOBIBRI_TRUST_PROXY: "1"
      # Creates the first account. Remove once you have signed in.
      KOBIBRI_ADMIN_PASSWORD: change-me-then-remove-this-line
      # Endpoints kobibri does not implement go to the real Kobo store, so the
      # shop, firmware updates and bought books keep working. "off" disables.
      KOBIBRI_PROXY_UPSTREAM: https://storeapi.kobo.com
      # How often to look for new chapters in imported serials. Or "off".
      KOBIBRI_IMPORT_CHECK_EVERY: 24h
      KOBIBRI_LOG_LEVEL: info
      # Ceilings for the rebuildable caches, in bytes.
      # KOBIBRI_KEPUB_CACHE_BYTES: "4294967296"
      # KOBIBRI_EPUB_CACHE_BYTES: "4294967296"
      # KOBIBRI_COVER_CACHE_BYTES: "1073741824"

volumes:
  kobibri-data:

# Books held in FB2, AZW3 or MOBI need Calibre's ebook-convert, which this image
# does not ship — it would multiply the image size for something many libraries
# never need. Books already in EPUB sync either way. To convert the rest, use an
# image with Calibre in it and point KOBIBRI_EBOOK_CONVERT at the binary.
