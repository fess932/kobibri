# Reverse-proxy fragment for kobibri.
#
# Two things here are not the usual boilerplate, and both come from the device
# rather than from taste:
#
#   - Kobo firmware ships an old TLS stack. A TLS-1.3-only profile is rejected
#     at handshake, so TLS 1.2 has to stay enabled.
#   - Sync responses are large, and the default proxy buffers are not. Without
#     the enlarged buffers below, a sync fails with a 502 partway through.

server {
    listen 443 ssl;
    http2 on;
    server_name books.example.com;

    ssl_certificate     /etc/letsencrypt/live/books.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/books.example.com/privkey.pem;

    # Keep 1.2: a Kobo cannot negotiate a 1.3-only server.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Book downloads are whole EPUBs; do not cap them.
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8078;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Sync responses overflow the defaults and the device sees a 502.
        proxy_buffer_size        1024k;
        proxy_buffers          4 512k;
        proxy_busy_buffers_size  1024k;

        # A large book over slow Wi-Fi takes a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Downloads should stream rather than be buffered to disk first.
        proxy_request_buffering off;
    }
}

# Set KOBIBRI_BASE_URL=https://books.example.com and KOBIBRI_TRUST_PROXY=1 so
# the links kobibri hands the device are the public ones.
#
# If the reader fails to resolve the hostname — some firmware does — point
# api_endpoint at the server's IP address instead.
