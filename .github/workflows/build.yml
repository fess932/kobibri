name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Every action here is on its node24 major. Node 20 is deprecated and the older
# majors were being force-run on node24 anyway, with a warning per job.
#
# These majors need Actions runner v2.327.1 or newer, which every GitHub-hosted
# runner already is. Moving any job to a self-hosted runner means checking that
# first — the failure is at startup, not in the build.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      # The race detector is deliberately not run here — it roughly triples the
      # job, and this is the one check that has to stay quick enough to sit in
      # front of every push.
      #
      # It still matters: a scan rewrites the same rows a paginated sync is
      # reading from, which is exactly what it catches. `make race` runs it, and
      # it is worth running before a release and after anything that touches the
      # scanner, the scheduler or the sync engine.

  image:
    # An image nobody tested is worse than no image.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # A pull request builds but publishes nothing — it has no write token.
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Both architectures are cross-compiled from one native runner rather than
      # emulated: the binary is pure Go, so QEMU would only make it slow.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
